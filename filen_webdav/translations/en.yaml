configuration:
  email:
    name: Filen email
    description: Email address of the Filen account.
  password:
    name: Filen password
    description: Password of the Filen account.
  api_key:
    name: Filen API key
    description: Create once with the Filen CLI (filen export-api-key). No 2FA prompt is needed at startup.
  root_folder:
    name: Folder in Filen
    description: Only this folder is shared via WebDAV. Created at startup if missing.
  webdav_user:
    name: WebDAV user
    description: User name Home Assistant uses to log in to the WebDAV server.
  webdav_password:
    name: WebDAV password
    description: Separate password for the WebDAV server, not the Filen password.
  cache_mode:
    name: Cache
    description: 'off: uploads go straight to Filen and Home Assistant sees errors immediately (recommended). writes: buffer locally first, then upload.'
  log_level:
    name: Log level
    description: Log verbosity.
  foto_sortierung:
    name: Photo sorting enabled
    description: Sorts photos and videos from the source folders by capture date into YYYY/YYYY-MM.
  foto_probelauf:
    name: Dry run only
    description: 'On: nothing is moved, only a report (CSV in share/filen_webdav) and a notification.'
  foto_quellen:
    name: Source folders in Filen
    description: Folders to sort.
  foto_ziel:
    name: Target folder in Filen
    description: YYYY/YYYY-MM plus _Duplikate, _Ohne-Datum and _Google-Metadaten are created here.
  foto_uhrzeit:
    name: Daily run time
    description: HH:MM
  foto_beim_start:
    name: Sort on start
    description: Also run right after the app starts.
  onedrive_modus:
    name: OneDrive mode
    description: off | analyse | umzug (migrate). Runs once on start.
  onedrive_token:
    name: OneDrive token
    description: Output of "rclone authorize onedrive".
  onedrive_drive_id:
    name: OneDrive drive ID
    description: Shown in the OneDrive web URL after /personal/.
  onedrive_probelauf:
    name: 'OneDrive: dry run'
    description: 'On: only plan.'
  onedrive_ziel:
    name: Target folder in Filen
    description: Copied OneDrive folders go to <target>/<path>.
  onedrive_kopieren:
    name: Copy folders/files
    description: OneDrive paths to copy completely and verify.
  onedrive_fotos_abgleich:
    name: Reconcile photos
    description: Only photos missing in Filen /Fotos are copied to /Fotos/_Aus-OneDrive.
  onedrive_loeschen:
    name: Delete in OneDrive after verification
    description: Only verified folders are deleted (OneDrive recycle bin).
  onedrive_nur_loeschen:
    name: Delete without copy
    description: OneDrive paths to delete. Only if all copies succeeded and deletion is on.
network:
  8080/tcp: Only needed for access from other devices
