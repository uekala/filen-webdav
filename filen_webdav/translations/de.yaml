configuration:
  email:
    name: Filen-E-Mail
    description: E-Mail-Adresse des Filen-Kontos.
  password:
    name: Filen-Passwort
    description: Passwort des Filen-Kontos.
  api_key:
    name: Filen-API-Schlüssel
    description: Einmalig mit der Filen-CLI erzeugen (filen export-api-key). Damit ist beim Start keine 2FA-Eingabe nötig.
  root_folder:
    name: Ordner in Filen
    description: Nur dieser Ordner wird per WebDAV freigegeben. Wird beim Start angelegt, falls er fehlt.
  webdav_user:
    name: WebDAV-Benutzer
    description: Benutzername, mit dem sich Home Assistant am WebDAV-Server anmeldet.
  webdav_password:
    name: WebDAV-Passwort
    description: Eigenes Passwort für den WebDAV-Server, nicht das Filen-Passwort.
  cache_mode:
    name: Zwischenspeicher
    description: 'off: Uploads gehen direkt zu Filen, Fehler sieht Home Assistant sofort (empfohlen). writes: erst lokal puffern, dann hochladen.'
  log_level:
    name: Protokollstufe
    description: Ausführlichkeit des Protokolls.
  foto_sortierung:
    name: Fotosortierung aktiv
    description: Sortiert Fotos und Videos aus den Quellordnern nach Aufnahmedatum in Ordner JJJJ/JJJJ-MM.
  foto_probelauf:
    name: Nur Probelauf
    description: 'An: nichts wird verschoben, nur ein Bericht (CSV in share/filen_webdav) und eine Benachrichtigung. Erst ausschalten, wenn der Bericht passt.'
  foto_modus:
    name: Modus
    description: 'verschieben: Dateien wandern aus den Quellordnern ins Ziel. kopieren: Quellordner bleiben unverändert, nur neue Dateien werden ins Ziel kopiert – nötig für den Kamera-Upload-Ordner der Filen-App, die verschobene Fotos sonst erneut hochlädt.'
  foto_quellen:
    name: Quellordner in Filen
    description: Ordner, die sortiert werden sollen. Für den Kamera-Upload-Ordner der Filen-App den Modus „kopieren“ wählen.
  foto_ziel:
    name: Zielordner in Filen
    description: Hier entstehen JJJJ/JJJJ-MM sowie _Duplikate, _Ohne-Datum und _Google-Metadaten.
  foto_uhrzeit:
    name: Uhrzeit für den täglichen Lauf
    description: HH:MM
  foto_beim_start:
    name: Beim Start sortieren
    description: Zusätzlich direkt nach dem Start der App laufen (praktisch nach Änderung der Einstellungen).
  onedrive_modus:
    name: OneDrive-Modus
    description: aus | analyse (nur einlesen, Bericht ins Protokoll und nach share/filen_webdav) | umzug (kopieren, prüfen, ggf. löschen). Läuft einmal beim Start der App.
  onedrive_token:
    name: OneDrive-Token
    description: Ausgabe von „rclone authorize onedrive“ am PC (die JSON-Zeile in geschweiften Klammern).
  onedrive_drive_id:
    name: OneDrive-Laufwerks-ID
    description: Steht in der OneDrive-Web-Adresse hinter /personal/.
  onedrive_probelauf:
    name: 'OneDrive: nur Probelauf'
    description: 'An: Umzug wird nur geplant und ins Protokoll geschrieben.'
  onedrive_ziel:
    name: Zielordner in Filen
    description: Kopierte OneDrive-Ordner landen unter <Ziel>/<Pfad>.
  onedrive_kopieren:
    name: Ordner/Dateien kopieren
    description: OneDrive-Pfade, die vollständig nach Filen kopiert und Datei für Datei geprüft werden.
  onedrive_fotos_abgleich:
    name: Fotos abgleichen
    description: 'OneDrive-Ordner mit Fotos: nur was in Filen /Fotos noch fehlt, wird nach /Fotos/_Aus-OneDrive kopiert.'
  onedrive_loeschen:
    name: Nach Prüfung in OneDrive löschen
    description: Nur fehlerfrei geprüfte Ordner werden gelöscht (OneDrive-Papierkorb, wiederherstellbar).
  onedrive_nur_loeschen:
    name: Ohne Kopie löschen
    description: OneDrive-Pfade, die nicht umziehen, sondern weg sollen. Nur wenn alle Kopien fehlerfrei waren und „Nach Prüfung löschen“ an ist.
  filen_uebersicht:
    name: "Filen-Übersicht erstellen"
    description: "Beim Start alle Ordner in Filen mit Anzahl und Größe ins Protokoll und nach share/filen_webdav schreiben."
  filen_duplikate:
    name: "Filen: Doppel suchen"
    description: "Beim Start doppelte Dateien in Filen suchen (ab 1 MB gleiche Größe, darunter Name und Größe) und nach Ordnern zusammenfassen. Nur lesen, löscht nichts."
  filen_probelauf:
    name: "Filen ordnen: nur Probelauf"
    description: "An: Verschiebungen werden nur geplant und ins Protokoll geschrieben."
  filen_verschieben:
    name: "Filen: verschieben"
    description: "Eine Zeile je Ordner oder Datei: „/von -> /nach“. Läuft beim Start, serverseitig ohne neues Hochladen. Existiert das Ziel schon, wird nichts zusammengeführt."
  filen_aufraeumen:
    name: "Filen: aufräumen"
    description: "Regeln, je Zeile: „doppelt: /A => /B“ legt Dateien unter A in den Papierkorb, die es unter B inhaltsgleich gibt (BLAKE3-Hash von Filen); „einmal: /A“ behält innerhalb von A von gleichen Dateien nur eine; „weg: /Pfad“ legt einen Ordner oder eine Datei in den Papierkorb. Läuft beim Start, mit „nur Probelauf“ zuerst testen."
network:
  8080/tcp: Nur nötig für Zugriff von anderen Geräten
