name: Filen WebDAV
version: "0.5.0"
slug: filen_webdav
description: WebDAV-Zugang zu Filen.io für HA-Backups, dazu ein Sortierer, der Fotos in Filen nach Aufnahmedatum ordnet
url: https://github.com/uekala/filen-webdav
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
# Startet Home Assistant neu, wenn der WebDAV-Server nicht mehr antwortet.
watchdog: "tcp://[HOST]:[PORT:8080]"
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Nur nötig für Zugriff von anderen Geräten; Home Assistant selbst nutzt das interne Netz
# Für die Benachrichtigung nach der Fotosortierung.
homeassistant_api: true
# Berichte der Fotosortierung landen in /share/filen_webdav.
map:
  - type: share
    read_only: false
# Der Zwischenspeicher gehört nicht ins Backup.
backup_exclude:
  - "cache/*"
options:
  email: ""
  password: ""
  api_key: ""
  root_folder: "/Home Assistant"
  webdav_user: homeassistant
  webdav_password: ""
  cache_mode: "off"
  log_level: INFO
  foto_sortierung: false
  foto_probelauf: true
  foto_quellen:
    - /Fotos/Google-Fotos-Export-2026-11
    - /Fotos/Google-Fotos-nur-Sept-Export
  foto_ziel: /Fotos
  foto_uhrzeit: "03:30"
  foto_beim_start: true
  onedrive_modus: aus
  onedrive_token: ""
  onedrive_drive_id: ""
  onedrive_probelauf: true
  onedrive_ziel: /OneDrive
  onedrive_kopieren: []
  onedrive_fotos_abgleich: []
  onedrive_loeschen: false
  onedrive_nur_loeschen: []
  filen_uebersicht: false
  filen_duplikate: false
  filen_probelauf: true
  filen_verschieben: []
  filen_aufraeumen: []
schema:
  email: email
  password: password
  api_key: password
  root_folder: str
  webdav_user: str
  webdav_password: password
  cache_mode: list(off|writes)
  log_level: list(ERROR|NOTICE|INFO|DEBUG)
  foto_sortierung: bool
  foto_probelauf: bool
  foto_quellen:
    - str
  foto_ziel: str
  foto_uhrzeit: match(^([01]\d|2[0-3]):[0-5]\d$)
  foto_beim_start: bool
  onedrive_modus: list(aus|analyse|umzug)
  onedrive_token: password?
  onedrive_drive_id: str?
  onedrive_probelauf: bool
  onedrive_ziel: str
  onedrive_kopieren:
    - str?
  onedrive_fotos_abgleich:
    - str?
  onedrive_loeschen: bool
  onedrive_nur_loeschen:
    - str?
  filen_uebersicht: bool
  filen_duplikate: bool
  filen_probelauf: bool
  filen_verschieben:
    - str?
  filen_aufraeumen:
    - str?
