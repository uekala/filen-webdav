name: Image

# Baut das Image für amd64 und arm64. Auf main wird es nach ghcr.io/<owner>/filen-webdav veröffentlicht
# (Tags: Version aus config.yaml und latest). Bei Pull Requests wird nur gebaut, nichts veröffentlicht.
on:
  push:
    branches: [main]
    paths:
      - "filen_webdav/**"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "filen_webdav/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      VEROEFFENTLICHEN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - name: Version aus config.yaml lesen
        id: version
        run: |
          version=$(sed -n 's/^version: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\} *$/\1/p' filen_webdav/config.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.VEROEFFENTLICHEN == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/filen-webdav
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: filen_webdav
          platforms: linux/amd64,linux/arm64
          push: ${{ env.VEROEFFENTLICHEN == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
